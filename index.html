<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>Instagram followers checker</title>
  </head>
  <body>
    <header class="mx-auto flex justify-between m-10 sm:flex-row font-sans">
      <a href="/">
        <img src="/logo.png" alt="Instagram followers checker logo" />
      </a>
      <h1 class="text-2xl">Instagram followers checker</h1>
    </header>
    <main id="app" class="font-sans">
      <h2>Compare your followers and following</h2>
      <p>Find out how to export your data from your personal account.</p>
      <button id="demoModalTrigger" type="button" aria-label="How to export your Instagram data">
        button

      <div id="modal" role="dialog">
        <h1>Modal content</h1>
        <p>Modal text</p>
        <button id="closeBtn" aria-label="close">x</button>
      </div>
      <div id="backdrop" class="modal-backgroud"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
